<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knitting Patterns — Sign In</title>
<meta name="theme-color" content="#290d13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Playfair+Display:wght@600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #290d13;
    color: #d8c4a8;
    font-family: "Spectral", Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
  }
  .box {
    background: #3b1720;
    border: 1px solid #562634;
    border-radius: 8px;
    padding: 2rem;
    width: min(320px, 90vw);
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: #e8dcc4;
    margin-bottom: 1.5rem;
    text-align: center;
    letter-spacing: 0.01em;
  }
  input[type=password] {
    width: 100%;
    background: #290d13;
    border: 1px solid #63303d;
    border-radius: 4px;
    color: #d8c4a8;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1rem;
    padding: 0.6rem 0.8rem;
    margin-bottom: 1rem;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=password]:focus { border-color: #d7a13f; }
  button {
    width: 100%;
    background: #d7a13f;
    color: #290d13;
    border: none;
    border-radius: 4px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 0.65rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: #e6b855; }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    color: #c8443a;
    font-size: 0.85rem;
    margin-top: 0.75rem;
    text-align: center;
    min-height: 1.2em;
  }
</style>
</head>
<body>
<div class="box">
  <h1>Knitting Patterns</h1>
  <input type="password" id="pw" placeholder="Password" autofocus autocomplete="current-password">
  <button id="btn">Sign in</button>
  <div class="error" id="err"></div>
</div>
<script>
  const pw  = document.getElementById('pw');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');

  async function login() {
    if (!pw.value) return;
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    err.textContent = '';
    try {
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw.value }),
      });
      if (resp.ok) {
        window.location.href = '/';
      } else {
        err.textContent = 'Incorrect password.';
        btn.disabled = false;
        btn.textContent = 'Sign in';
        pw.select();
      }
    } catch {
      err.textContent = 'Connection error — try again.';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }

  btn.addEventListener('click', login);
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
