<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knitting Chart Viewer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, sans-serif;
  background: #0d1b2a;
  color: #ddd;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}

/* ── toolbar ── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  background: #1a2332;
  border-bottom: 1px solid #2a3444;
  flex-shrink: 0;
  flex-wrap: wrap;
}
#toolbar h1 { font-size: 0.8rem; font-weight: 600; color: #aaa; white-space: nowrap; }

.divider { width: 1px; height: 26px; background: #444; flex-shrink: 0; }

.btn {
  background: #333;
  border: 1px solid #555;
  color: #ccc;
  border-radius: 5px;
  padding: 5px 13px;
  cursor: pointer;
  font-size: 0.85rem;
  user-select: none;
  white-space: nowrap;
}
.btn:hover  { background: #3e3e3e; }
.btn:active { background: #4a4a4a; }
.btn.small  { padding: 4px 9px; font-size: 1rem; font-weight: 700; min-width: 28px; }
.btn.active { background: #2a3a2a; border-color: #5a8a5a; color: #8aba8a; }

#ridge-badge {
  font-size: 1rem;
  font-weight: 700;
  color: #f5c842;
  min-width: 120px;
  white-space: nowrap;
}

/* Row-type badge (Wrong Side / Right Side) */
#row-type-badge {
  font-size: 0.82rem;
  font-weight: 700;
  white-space: nowrap;
  padding: 4px 10px;
  border-radius: 5px;
  background: #1a2e1a;
  border: 1px solid #3a5a3a;
  color: #7bc87b;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
#row-type-badge.rs {
  background: #2e1e0a;
  border-color: #5a3a0a;
  color: #d48b2a;
}

/* Active-stitch badge */
#stitch-badge {
  font-size: 0.9rem;
  font-weight: 600;
  color: #50c8ea;
  white-space: nowrap;
}

.ctrl-label {
  font-size: 0.75rem;
  color: #888;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}

input[type=number] {
  width: 52px;
  background: #2a2a2a;
  border: 1px solid #555;
  border-radius: 4px;
  color: #ddd;
  font-size: 0.82rem;
  padding: 3px 6px;
  text-align: center;
}

.zoom-group { display: flex; align-items: center; gap: 6px; }
.zoom-group input[type=range] {
  width: 120px;
  accent-color: #f5c842;
  cursor: pointer;
  height: 6px;
}
#zoom-label { font-size: 0.85rem; color: #f5c842; font-weight: 600; min-width: 36px; }

/* ── body layout (grid + sidebar side-by-side) ── */
#body-row {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
  position: relative;   /* needed for RS overlay */
}

/* ── Right-Side-Row overlay ── */
#rs-overlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 50;
  background: rgba(6, 6, 6, 0.82);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  pointer-events: none;  /* let clicks fall through to toolbar etc. */
}
#rs-overlay.visible { display: flex; }

#rs-overlay-ridgenum {
  font-size: 0.9rem;
  color: #888;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
#rs-overlay-title {
  font-size: 2.4rem;
  font-weight: 700;
  color: #e8a030;
  letter-spacing: 0.03em;
}
#rs-overlay-sub {
  font-size: 1.15rem;
  color: #cccccc;
}
#rs-overlay-hint {
  font-size: 0.8rem;
  color: #555;
  margin-top: 10px;
}

/* ── scroll region ── */
#scroll-wrap {
  flex: 1;
  overflow: auto;
  position: relative;
  background: #0a1520;
  min-width: 0;
}

#col-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: block;
}

#grid-canvas {
  display: block;
  image-rendering: pixelated;
  cursor: crosshair;
}

/* ── statusbar ── */
#status {
  padding: 3px 14px;
  font-size: 0.7rem;
  color: #555;
  background: #1a2332;
  border-top: 1px solid #2a3444;
  flex-shrink: 0;
}

/* ── guide-line colour picker popup ── */
#guide-popup {
  display: none;
  position: fixed;
  z-index: 200;
  background: #2c2c2c;
  border: 1px solid #555;
  border-radius: 10px;
  padding: 10px 12px 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.7);
}
#guide-popup .popup-title {
  font-size: 0.72rem;
  color: #999;
  margin-bottom: 9px;
  text-align: center;
}
#guide-popup .popup-title strong { color: #ddd; }
.swatch-row {
  display: flex;
  gap: 7px;
  justify-content: center;
}
.swatch {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.08);
  transition: border-color 0.12s, transform 0.1s;
  position: relative;
}
.swatch:hover  { border-color: rgba(255,255,255,0.7); transform: scale(1.12); }
.swatch.active { border-color: #fff; }
.swatch .swatch-tip {
  display: none;
  position: absolute;
  bottom: calc(100% + 5px);
  left: 50%;
  transform: translateX(-50%);
  background: #111;
  color: #ddd;
  font-size: 0.65rem;
  padding: 2px 5px;
  border-radius: 3px;
  white-space: nowrap;
  pointer-events: none;
}
.swatch:hover .swatch-tip { display: block; }

/* ── sidebar ── */
#sidebar {
  width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: #1a2332;
  border-left: 1px solid #2a3444;
  transition: width 0.22s ease;
  flex-shrink: 0;
}
#sidebar.open {
  width: 270px;
}

#sb-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px 10px;
  border-bottom: 1px solid #2a3444;
  flex-shrink: 0;
  white-space: nowrap;
}
#sb-header-left { display: flex; flex-direction: column; gap: 2px; }
#sb-title { font-size: 0.85rem; font-weight: 600; color: #ccc; }
#sb-autosave {
  font-size: 0.65rem;
  color: #4a7a4a;
  display: flex;
  align-items: center;
  gap: 4px;
}
#sb-autosave::before {
  content: "●";
  font-size: 0.55rem;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.3; }
}
#btn-sidebar-close {
  background: none;
  border: none;
  color: #555;
  font-size: 1rem;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  line-height: 1;
}
#btn-sidebar-close:hover { color: #bbb; background: #2a2a2a; }

/* Last-saved banner inside sidebar */
#sb-current {
  padding: 10px 14px;
  border-bottom: 1px solid #2a3444;
  flex-shrink: 0;
  white-space: nowrap;
}
#sb-current-label {
  font-size: 0.65rem;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
}
#sb-current-ridge {
  font-size: 1.5rem;
  font-weight: 700;
  color: #f5c842;
  line-height: 1;
}
#sb-current-sub {
  font-size: 0.68rem;
  color: #555;
  margin-top: 2px;
}

/* ── scrollbars ── */
#scroll-wrap {
  scrollbar-width: thin;
  scrollbar-color: rgba(80,120,160,0.3) transparent;
}
#scroll-wrap::-webkit-scrollbar { width: 7px; height: 7px; }
#scroll-wrap::-webkit-scrollbar-track { background: transparent; }
#scroll-wrap::-webkit-scrollbar-corner { background: transparent; }
#scroll-wrap::-webkit-scrollbar-thumb {
  background: rgba(80,120,160,0.28);
  border-radius: 4px;
}
#scroll-wrap::-webkit-scrollbar-thumb:hover { background: rgba(80,120,160,0.60); }

/* history list */
#sb-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0 8px;
  scrollbar-width: thin;
  scrollbar-color: rgba(60,80,110,0.35) transparent;
}
#sb-list::-webkit-scrollbar { width: 4px; }
#sb-list::-webkit-scrollbar-track { background: transparent; }
#sb-list::-webkit-scrollbar-thumb {
  background: rgba(60,80,110,0.4);
  border-radius: 2px;
}
#sb-list::-webkit-scrollbar-thumb:hover { background: rgba(80,110,150,0.70); }

.hist-date-hdr {
  padding: 8px 14px 3px;
  font-size: 0.62rem;
  color: #4a4a4a;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.hist-entry {
  display: flex;
  align-items: center;
  padding: 5px 14px;
  cursor: pointer;
  gap: 8px;
  transition: background 0.1s;
  white-space: nowrap;
}
.hist-entry:hover { background: #232323; }
.hist-entry.is-current { background: #1e2a0e; }
.hist-ridge {
  font-size: 0.9rem;
  font-weight: 700;
  color: #f5c842;
  min-width: 90px;
}
.hist-ridge.rs { color: #d48b2a; }
.hist-entry.is-current .hist-ridge { color: #aad060; }
.hist-time {
  font-size: 0.68rem;
  color: #555;
  flex: 1;
}
.hist-del {
  font-size: 0.75rem;
  color: #333;
  padding: 2px 5px;
  border-radius: 3px;
  line-height: 1;
  user-select: none;
}
.hist-entry:hover .hist-del { color: #555; }
.hist-del:hover { color: #e05050 !important; background: #2a2020; }

#sb-empty {
  padding: 24px 14px;
  font-size: 0.75rem;
  color: #444;
  line-height: 1.6;
  white-space: normal;
}

#sb-footer {
  padding: 10px 14px;
  border-top: 1px solid #2a3444;
  flex-shrink: 0;
}
#btn-clear-hist {
  width: 100%;
  background: #222;
  border: 1px solid #3a3a3a;
  color: #555;
  font-size: 0.72rem;
  padding: 6px;
  border-radius: 5px;
  cursor: pointer;
  white-space: nowrap;
}
#btn-clear-hist:hover { border-color: #a03030; color: #c06060; background: #201818; }

/* history count badge on toolbar button */
#hist-count {
  display: inline-block;
  background: #3a4a3a;
  color: #8ab08a;
  font-size: 0.65rem;
  font-weight: 700;
  border-radius: 8px;
  padding: 1px 5px;
  margin-left: 4px;
  min-width: 18px;
  text-align: center;
}
</style>
</head>
<body>

<div id="toolbar">
  <h1 id="chart-title">Knitting Chart</h1>
  <div class="divider"></div>

  <button class="btn" id="btn-next">↑ Next</button>
  <span id="ridge-badge">Ridge — / —</span>
  <button class="btn" id="btn-prev">↓ Prev</button>
  <span class="ctrl-label">Go to ridge <input type="number" id="goto-input" min="1" value="1"></span>

  <div class="divider"></div>

  <span id="row-type-badge">Wrong Side Row</span>
  <span id="stitch-badge">St.&nbsp;1</span>

  <div class="divider"></div>

  <span class="ctrl-label">
    Zoom
    <div class="zoom-group">
      <button class="btn small" id="btn-zoom-out">−</button>
      <input type="range" id="zoom-slider" min="1" max="40" value="20" step="1">
      <button class="btn small" id="btn-zoom-in">+</button>
    </div>
    <span id="zoom-label">20px</span>
  </span>

  <div class="divider"></div>

  <span class="ctrl-label">
    Stitch guides every
    <input type="number" id="stitch-interval" min="1" max="200" value="10" style="width:44px">
  </span>
  <span class="ctrl-label">
    Ridge guides every
    <input type="number" id="ridge-interval" min="1" max="200" value="10" style="width:44px">
  </span>

  <div class="divider"></div>

  <button class="btn" id="btn-history">History <span id="hist-count">0</span></button>
</div>

<!-- main body: grid + sidebar -->
<div id="body-row">
  <div id="scroll-wrap">
    <canvas id="col-header"></canvas>
    <canvas id="grid-canvas"></canvas>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sb-header">
      <div id="sb-header-left">
        <div id="sb-title">Ridge History</div>
        <div id="sb-autosave">Position saved automatically</div>
      </div>
      <button id="btn-sidebar-close">✕</button>
    </div>

    <div id="sb-current">
      <div id="sb-current-label">Current position</div>
      <div id="sb-current-ridge">—</div>
      <div id="sb-current-sub">—</div>
    </div>

    <div id="sb-list"></div>

    <div id="sb-footer">
      <button id="btn-clear-hist">Clear all history</button>
    </div>
  </div>

  <!-- Right-Side-Row overlay (shown when knitting the plain RS row) -->
  <div id="rs-overlay">
    <div id="rs-overlay-ridgenum">Ridge <span id="rs-ridge-num">—</span></div>
    <div id="rs-overlay-title">Right Side Row</div>
    <div id="rs-overlay-sub">Knit the entire row</div>
    <div id="rs-overlay-hint">Press Return when done to see the chart →</div>
  </div>
</div>

<div id="status">Loading…</div>

<!-- Stitch-marker colour picker -->
<div id="guide-popup">
  <div class="popup-title">Stitch marker at stitch <strong id="popup-stitch-num"></strong></div>
  <div class="swatch-row" id="popup-swatches"></div>
</div>

  { name: "Mint",   solid: "#5ce8dc", guide: "rgba(92,232,220,0.85)"  },
  { name: "Grey",   solid: "#909090", guide: "rgba(150,150,150,0.78)" },
];
const DEFAULT_MARKER = MARKER_COLORS[1]; // red
const stitchGuide = {};
function guideEntry(sn) { return stitchGuide[sn] || DEFAULT_MARKER; }

// ─── canvas colours ────────────────────────────────────────────────────────
const CELL_COLOR    = ["#ffffff", "#aaaaaa", "#2e2e2e"];
const RIDGE_GUIDE   = "rgba(210,60,60,0.75)";
const CELL_LINE     = "rgba(0,0,0,0.30)";
const HL_FILL       = "rgba(245,200,66,0.20)";
const HL_STROKE     = "rgba(245,200,66,0.90)";
const ST_HL_FILL    = "rgba(80,200,255,0.13)";
const ST_HL_STROKE  = "rgba(80,200,255,0.70)";
const LBL_BG_NORM   = "rgba(28,28,28,0.85)";
const LBL_BG_ACT    = "rgba(55,45,0,0.95)";
const LBL_FG_NORM   = "#666";
const LBL_FG_ACT    = "#f5c842";
const HDR_BG        = "#1a2332";

// ─── canvas refs ───────────────────────────────────────────────────────────
const colHeaderCanvas = document.getElementById("col-header");
const chCtx           = colHeaderCanvas.getContext("2d");
const gridCanvas      = document.getElementById("grid-canvas");
const gCtx            = gridCanvas.getContext("2d");

// ─── layout ────────────────────────────────────────────────────────────────
let ROW_LABEL_W = 0;
let COL_LABEL_H = 0;

function computeDims() {
  const fs    = Math.max(9, Math.min(cellPx, 14));
  ROW_LABEL_W = fs * 3.8 + 8;
  COL_LABEL_H = fs + 8;
}
function totalW() { return ROW_LABEL_W + NCOLS * cellPx + 24; }
function totalH() { return NROWS * cellPx + 24; }

// ─── persistence & history ─────────────────────────────────────────────────
const LS_STATE       = "knitting_viewer_state";
const LS_HISTORY     = "knitting_viewer_history";
const LS_STITCH_GUIDE = "knitting_viewer_stitch_guide";
const MAX_HIST       = 500;

function loadState() {
  try {
    const v = JSON.parse(localStorage.getItem(LS_STATE) || "null");
    if (v && typeof v.ridge === "number") return v;
    // Backward compat: read old plain ridge key
    const old = localStorage.getItem("knitting_viewer_ridge");
    const n   = old ? parseInt(old, 10) : NaN;
    if (!isNaN(n)) return { ridge: n, stitch: 1, isRightSide: false };
  } catch {}
  return null;
}
function saveState() {
  try {
    localStorage.setItem(LS_STATE, JSON.stringify({
      ridge: activeRidge, stitch: activeStitch, isRightSide: isRightSideRow
    }));
  } catch(e) {}
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(LS_HISTORY) || "[]"); }
  catch { return []; }
}
function saveHistory(hist) {
  try { localStorage.setItem(LS_HISTORY, JSON.stringify(hist)); } catch(e) {}
}

function loadStitchGuide() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_STITCH_GUIDE) || "{}");
    // Convert saved color names back to marker color objects
    for (const [snStr, colorName] of Object.entries(saved)) {
      const sn = parseInt(snStr, 10);
      const mc = MARKER_COLORS.find(m => m.name === colorName);
      if (mc) stitchGuide[sn] = mc;
    }
  } catch(e) {}
}
function saveStitchGuide() {
  try {
    // Store as stitch number -> color name mapping
    const toSave = {};
    for (const [snStr, mc] of Object.entries(stitchGuide)) {
      toSave[snStr] = mc.name;
    }
    localStorage.setItem(LS_STITCH_GUIDE, JSON.stringify(toSave));
  } catch(e) {}
}

// Debounced history entry: written 2 s after navigation settles
let histTimer   = null;
let lastHistKey = null;

function scheduleHistEntry() {
  const ridge = activeRidge, isRS = isRightSideRow;
  clearTimeout(histTimer);
  histTimer = setTimeout(() => {
    const key = `${ridge}_${isRS}`;
    if (key === lastHistKey) return;
    lastHistKey = key;
    const hist = loadHistory();
    hist.unshift({ ridge, isRightSide: isRS, ts: Date.now() });
    if (hist.length > MAX_HIST) hist.length = MAX_HIST;
    saveHistory(hist);
    refreshSidebar();
    updateHistBadge();
  }, 2000);
}

// Save on page unload so closing tab always captures last position
window.addEventListener("beforeunload", () => {
  saveState();
  const key = `${activeRidge}_${isRightSideRow}`;
  if (key !== lastHistKey) {
    lastHistKey = key;
    const hist = loadHistory();
    hist.unshift({ ridge: activeRidge, isRightSide: isRightSideRow, ts: Date.now() });
    if (hist.length > MAX_HIST) hist.length = MAX_HIST;
    saveHistory(hist);
  }
});

// ─── column header ─────────────────────────────────────────────────────────
function drawColHeader() {
  const W = totalW(), H = COL_LABEL_H;
  colHeaderCanvas.width  = W;
  colHeaderCanvas.height = H;
  const fs = Math.max(9, Math.min(cellPx, 14));
  chCtx.fillStyle = HDR_BG;
  chCtx.fillRect(0, 0, W, H);
  chCtx.font         = `${fs}px monospace`;
  chCtx.textBaseline = "middle";
  chCtx.textAlign    = "center";
  chCtx.lineWidth    = 1;
  for (let c = 0; c < NCOLS; c++) {
    const sn     = stitchNum(c);
    if (sn % stitchInterv !== 0) continue;
    const lineX  = ROW_LABEL_W + (c + 1) * cellPx;          // line AFTER the stitch
    const labelX = ROW_LABEL_W + c * cellPx + cellPx / 2;   // centred inside the cell
    chCtx.strokeStyle = guideEntry(sn).guide;
    chCtx.beginPath(); chCtx.moveTo(lineX, 0); chCtx.lineTo(lineX, H); chCtx.stroke();
    chCtx.fillStyle = "#999";
    chCtx.fillText(String(sn), labelX, H / 2);
  }
  // Highlight the active 10-stitch block in the header
  const stStartCol = activeStitch - STITCH_AT_COL0;
  const stEndCol   = Math.min(stStartCol + 9, NCOLS - 1);
  if (stStartCol >= 0 && stStartCol < NCOLS) {
    const ax = ROW_LABEL_W + stStartCol * cellPx;
    const aw = (stEndCol - stStartCol + 1) * cellPx;
    chCtx.fillStyle = "rgba(80,200,255,0.22)";
    chCtx.fillRect(ax, 0, aw, H);

    // Two coloured dots + arrow representing the boundary markers on each side
    const dotR = Math.max(3, Math.min(Math.floor(H / 2) - 2, 5));
    if (aw >= dotR * 6 + 20) {
      const arrow  = "→";
      chCtx.font = `${fs}px sans-serif`;
      const arrowW = chCtx.measureText(arrow).width;
      const gap    = 4;
      const span   = dotR * 2 + gap + arrowW + gap + dotR * 2;
      const cx = ax + aw / 2, cy = H / 2;

      const leftNum    = activeStitch - 1;
      const rightNum   = Math.min(activeStitch + 9, STITCH_AT_COL0 + NCOLS - 1);
      const leftColor  = leftNum > 0 ? guideEntry(leftNum).solid : "rgba(120,120,120,0.4)";
      const rightColor = guideEntry(rightNum).solid;

      chCtx.beginPath(); chCtx.arc(cx - span/2 + dotR, cy, dotR, 0, Math.PI*2);
      chCtx.fillStyle = leftColor; chCtx.fill();

      chCtx.fillStyle = "rgba(200,200,200,0.65)";
      chCtx.textAlign = "center"; chCtx.textBaseline = "middle";
      chCtx.fillText(arrow, cx, cy);

      chCtx.beginPath(); chCtx.arc(cx + span/2 - dotR, cy, dotR, 0, Math.PI*2);
      chCtx.fillStyle = rightColor; chCtx.fill();
    }
  }
  chCtx.fillStyle = HDR_BG;
  chCtx.fillRect(0, 0, ROW_LABEL_W, H);
}

// ─── main grid ─────────────────────────────────────────────────────────────
function drawGrid() {
  const W = totalW(), H = totalH(), cs = cellPx;
  const patternW = NCOLS * cs;
  const patternH = NROWS * cs;
  gridCanvas.width  = W;
  gridCanvas.height = H;

  // 0. Fill margins with dark blue background
  gCtx.fillStyle = "#0d1b2a";
  gCtx.fillRect(0, 0, W, H);
  // Fill pattern area with scroll-wrap background
  gCtx.fillStyle = "#0a1520";
  gCtx.fillRect(0, 0, ROW_LABEL_W + patternW, patternH);

  // 1. Cells
  for (let r = 0; r < NROWS; r++) {
    for (let c = 0; c < NCOLS; c++) {
      gCtx.fillStyle = CELL_COLOR[GRID[r][c]] || "#f0f";
      gCtx.fillRect(ROW_LABEL_W + c * cs, r * cs, cs, cs);
    }
  }

  // 2. Black cell gridlines (only within pattern area, not margins)
  if (cs >= 3) {
    gCtx.beginPath();
    gCtx.strokeStyle = CELL_LINE;
    gCtx.lineWidth   = 1;
    for (let c = 0; c <= NCOLS; c++) {
      const x = ROW_LABEL_W + c * cs;
      gCtx.moveTo(x, 0); gCtx.lineTo(x, patternH);
    }
    for (let r = 0; r <= NROWS; r++) {
      const y = r * cs;
      gCtx.moveTo(ROW_LABEL_W, y); gCtx.lineTo(ROW_LABEL_W + patternW, y);
    }
    gCtx.stroke();
  }

  // 3a. Stitch guide lines — drawn AFTER the counted stitch (after 10th, 20th, …)
  const guideW = Math.max(1, cs * 0.12);
  for (let c = 0; c < NCOLS; c++) {
    const sn = stitchNum(c);
    if (sn % stitchInterv !== 0) continue;
    const x = ROW_LABEL_W + (c + 1) * cs;   // right edge of stitch sn
    gCtx.strokeStyle = guideEntry(sn).guide;
    gCtx.lineWidth   = guideW;
    gCtx.beginPath(); gCtx.moveTo(x, 0); gCtx.lineTo(x, patternH); gCtx.stroke();
  }

  // 3b. Ridge guide lines (only within pattern area, not margins)
  gCtx.strokeStyle = RIDGE_GUIDE;
  gCtx.lineWidth   = guideW;
  gCtx.beginPath();
  for (let r = 0; r < NROWS; r++) {
    if (ridgeNum(r) % ridgeInterv === 0) {
      const y = r * cs;
      gCtx.moveTo(ROW_LABEL_W, y); gCtx.lineTo(ROW_LABEL_W + patternW, y);
    }
  }
  gCtx.stroke();

  // 4. Active-ridge highlight
  const activeRow = rowForRidge(activeRidge);
  const ry = activeRow * cs;
  gCtx.fillStyle = HL_FILL;
  gCtx.fillRect(ROW_LABEL_W, ry, NCOLS * cs, cs);
  gCtx.strokeStyle = HL_STROKE;
  gCtx.lineWidth   = Math.max(1, cs * 0.18);
  const hw = gCtx.lineWidth / 2;
  gCtx.strokeRect(ROW_LABEL_W + hw, ry + hw, NCOLS * cs - gCtx.lineWidth, cs - gCtx.lineWidth);

  // 4b. Active 10-stitch block highlight — only on the active ridge row
  const stStartCol = activeStitch - STITCH_AT_COL0;
  const stEndCol   = Math.min(stStartCol + 9, NCOLS - 1);
  if (stStartCol >= 0 && stStartCol < NCOLS) {
    const stX = ROW_LABEL_W + stStartCol * cs;
    const stW = (stEndCol - stStartCol + 1) * cs;
    gCtx.fillStyle = ST_HL_FILL;
    gCtx.fillRect(stX, ry, stW, cs);
    gCtx.strokeStyle = ST_HL_STROKE;
    gCtx.lineWidth   = Math.max(1, cs * 0.18);
    const shw = gCtx.lineWidth / 2;
    gCtx.strokeRect(stX + shw, ry + shw, stW - gCtx.lineWidth, cs - gCtx.lineWidth);
  }

  // 5. Ridge labels
  const fs = Math.max(9, Math.min(cs, 14));
  gCtx.font         = `${fs}px monospace`;
  gCtx.textAlign    = "right";
  gCtx.textBaseline = "middle";
  const step = cs < 5 ? ridgeInterv : cs < 10 ? 5 : 1;
  for (let r = 0; r < NROWS; r++) {
    const rn       = ridgeNum(r);
    const isActive = rn === activeRidge;
    if (rn % step !== 0 && !isActive) continue;
    const y = r * cs;
    gCtx.fillStyle = isActive ? LBL_BG_ACT : LBL_BG_NORM;
    gCtx.fillRect(0, y, ROW_LABEL_W, cs);
    gCtx.fillStyle = isActive ? LBL_FG_ACT : LBL_FG_NORM;
    gCtx.fillText(String(rn), ROW_LABEL_W - 4, y + cs / 2);
  }
}

function render() {
  computeDims();
  drawColHeader();
  drawGrid();
  updateBadge();
}

// ─── navigation ────────────────────────────────────────────────────────────
const MIN_RIDGE = 1;
const MAX_RIDGE = RIDGE_AT_ROW0;

/**
 * Navigate to a ridge and row-type.
 * isRS defaults to the current isRightSideRow so callers that don't
 * care about the row type preserve the current state.
 */
function setRow(rn, isRS = isRightSideRow) {
  activeRidge    = Math.max(MIN_RIDGE, Math.min(MAX_RIDGE, rn));
  isRightSideRow = !!isRS;
  document.getElementById("goto-input").value = activeRidge;
  saveState();
  scheduleHistEntry();
  render();
  scrollToActiveRidge();
  updateBadge();
  updateSidebarCurrent();
  updateRSOverlay();
}

/** Navigate ±10 stitches horizontally. */
function setStitch(sn) {
  const minS = STITCH_AT_COL0;
  const maxS = STITCH_AT_COL0 + NCOLS - 10;  // last full 10-stitch block start
  activeStitch = Math.max(minS, Math.min(maxS, sn));
  saveState();
  render();
  scrollToActiveStitch();
  updateBadge();
}

function scrollToActiveRidge() {
  const wrap = document.getElementById("scroll-wrap");
  const row  = rowForRidge(activeRidge);
  const rowY = row * cellPx;
  const visH = wrap.clientHeight - COL_LABEL_H;
  wrap.scrollTop = rowY - visH / 2 + cellPx / 2;
}

function scrollToActiveStitch() {
  const wrap       = document.getElementById("scroll-wrap");
  const stStartCol = activeStitch - STITCH_AT_COL0;
  // Always centre the 10-stitch block in the visible area
  const blockCenterX = ROW_LABEL_W + (stStartCol + 5) * cellPx;
  wrap.scrollLeft = blockCenterX - wrap.clientWidth / 2;
}

function updateBadge() {
  const rowLabel = isRightSideRow ? "Right Side Row" : "Wrong Side Row";
  document.getElementById("ridge-badge").textContent =
    `Ridge ${activeRidge} / ${MAX_RIDGE}`;
  const rtBadge = document.getElementById("row-type-badge");
  rtBadge.textContent = rowLabel;
  rtBadge.classList.toggle("rs", isRightSideRow);
  const stEnd = Math.min(activeStitch + 9, STITCH_AT_COL0 + NCOLS - 1);
  document.getElementById("stitch-badge").textContent = `St. ${activeStitch}–${stEnd}`;
  document.getElementById("status").textContent =
    `${NCOLS} stitches (1–${NCOLS})  ·  ${NROWS} ridges (1–${MAX_RIDGE})  ·  ` +
    `ridge ${activeRidge}  ·  stitch ${activeStitch}  ·  ${rowLabel}  ·  ` +
    `↑↓/j/k: ridges  ·  ←→/Space: ±10 stitches  ·  ` +
    `Return: next row  ·  click guide line: change colour`;
}

function updateRSOverlay() {
  const overlay = document.getElementById("rs-overlay");
  overlay.classList.toggle("visible", isRightSideRow);
  if (isRightSideRow) {
    document.getElementById("rs-ridge-num").textContent =
      `${activeRidge} / ${MAX_RIDGE}`;
  }
}

function setZoom(v) {
  cellPx = Math.max(1, Math.min(40, v));
  document.getElementById("zoom-slider").value = cellPx;
  document.getElementById("zoom-label").textContent = cellPx + "px";
  render();
  scrollToActiveRidge();
}

// ─── sidebar ───────────────────────────────────────────────────────────────
let sidebarOpen = false;

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById("sidebar").classList.toggle("open", sidebarOpen);
  const btn = document.getElementById("btn-history");
  btn.classList.toggle("active", sidebarOpen);
  if (sidebarOpen) refreshSidebar();
}

function updateHistBadge() {
  document.getElementById("hist-count").textContent = loadHistory().length;
}

function updateSidebarCurrent() {
  const el  = document.getElementById("sb-current-ridge");
  const sub = document.getElementById("sb-current-sub");
  if (!el) return;
  el.textContent = `Ridge ${activeRidge}`;
  const rowType = isRightSideRow ? "Right Side Row" : "Wrong Side Row";
  const pct     = Math.round((activeRidge / MAX_RIDGE) * 100);
  sub.textContent = `${rowType}  ·  ${pct}% through`;
}

function fmt(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}
function fmtDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === today.toDateString())     return "Today";
  if (d.toDateString() === yesterday.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

function refreshSidebar() {
  if (!sidebarOpen) return;
  const hist = loadHistory();
  const list = document.getElementById("sb-list");
  list.innerHTML = "";

  updateHistBadge();
  updateSidebarCurrent();

  if (hist.length === 0) {
    list.innerHTML = `<div id="sb-empty">No history yet.<br><br>Your position saves automatically. Come back tomorrow and you'll pick up right where you left off.</div>`;
    return;
  }

  // Group by date (newest first; hist is already newest-first)
  let currentDate = null;
  hist.forEach((entry, idx) => {
    const dateStr = fmtDate(entry.ts);
    if (dateStr !== currentDate) {
      currentDate = dateStr;
      const hdr = document.createElement("div");
      hdr.className   = "hist-date-hdr";
      hdr.textContent = dateStr;
      list.appendChild(hdr);
    }

    const isRS      = !!entry.isRightSide;
    const isCurrent = entry.ridge === activeRidge && isRS === isRightSideRow;
    const row = document.createElement("div");
    row.className = "hist-entry" + (isCurrent ? " is-current" : "");

    const ridgeEl = document.createElement("span");
    ridgeEl.className = "hist-ridge" + (isRS ? " rs" : "");
    ridgeEl.textContent = `Ridge ${entry.ridge} (${isRS ? "RS" : "WS"})`;

    const timeEl = document.createElement("span");
    timeEl.className   = "hist-time";
    timeEl.textContent = fmt(entry.ts);

    const delEl = document.createElement("span");
    delEl.className   = "hist-del";
    delEl.textContent = "✕";
    delEl.title       = "Remove";

    row.appendChild(ridgeEl);
    row.appendChild(timeEl);
    row.appendChild(delEl);

    // Navigate on row click (restore saved RS/WS state)
    row.addEventListener("click", e => {
      if (e.target === delEl) {
        e.stopPropagation();
        const h = loadHistory();
        h.splice(idx, 1);
        saveHistory(h);
        refreshSidebar();
        updateHistBadge();
      } else {
        setRow(entry.ridge, isRS);
      }
    });

    list.appendChild(row);
  });
}

document.getElementById("btn-history").addEventListener("click", toggleSidebar);
document.getElementById("btn-sidebar-close").addEventListener("click", toggleSidebar);

document.getElementById("btn-clear-hist").addEventListener("click", () => {
  if (confirm("Clear all history entries?")) {
    saveHistory([]);
    lastHistKey = null;
    refreshSidebar();
    updateHistBadge();
  }
});

// ─── guide-line colour picker popup ────────────────────────────────────────
const guidePopup = document.getElementById("guide-popup");
const swatchRow  = document.getElementById("popup-swatches");
let popupStitch  = null;

MARKER_COLORS.forEach(mc => {
  const sw = document.createElement("div");
  sw.className        = "swatch";
  sw.style.background = mc.solid;
  sw.dataset.color    = mc.name;
  sw.innerHTML        = `<span class="swatch-tip">${mc.name}</span>`;
  sw.addEventListener("click", e => {
    e.stopPropagation();
    if (popupStitch !== null) { stitchGuide[popupStitch] = mc; saveStitchGuide(); render(); }
    hidePopup();
  });
  swatchRow.appendChild(sw);
});

function showPopup(sn, clientX, clientY) {
  popupStitch = sn;
  document.getElementById("popup-stitch-num").textContent = sn;
  const current = guideEntry(sn).name;
  swatchRow.querySelectorAll(".swatch").forEach(sw =>
    sw.classList.toggle("active", sw.dataset.color === current));
  guidePopup.style.display = "block";
  const pw = guidePopup.offsetWidth  || 220;
  const ph = guidePopup.offsetHeight || 80;
  let x = clientX + 10, y = clientY - Math.floor(ph / 2);
  if (x + pw > window.innerWidth  - 8) x = clientX - pw - 10;
  if (y < 8)                            y = 8;
  if (y + ph > window.innerHeight - 8)  y = window.innerHeight - ph - 8;
  guidePopup.style.left = x + "px";
  guidePopup.style.top  = y + "px";
}
function hidePopup() { guidePopup.style.display = "none"; popupStitch = null; }

function nearestGuide(canvasX) {
  const threshold = Math.max(5, cellPx * 0.45);
  let best = null, bestDist = Infinity;
  for (let c = 0; c < NCOLS; c++) {
    const sn = stitchNum(c);
    if (sn % stitchInterv !== 0) continue;
    const lx   = ROW_LABEL_W + (c + 1) * cellPx;  // guide is after the stitch
    const dist = Math.abs(canvasX - lx);
    if (dist < threshold && dist < bestDist) { bestDist = dist; best = sn; }
  }
  return best;
}

// ─── events ────────────────────────────────────────────────────────────────
document.getElementById("btn-next").addEventListener("click", () => setRow(activeRidge + 1));
document.getElementById("btn-prev").addEventListener("click", () => setRow(activeRidge - 1));
document.getElementById("goto-input").addEventListener("change", e =>
  setRow(parseInt(e.target.value, 10) || 1, false));

document.getElementById("zoom-slider").addEventListener("input", e => setZoom(+e.target.value));
document.getElementById("btn-zoom-in").addEventListener("click",  () => setZoom(cellPx + 1));
document.getElementById("btn-zoom-out").addEventListener("click", () => setZoom(cellPx - 1));

document.getElementById("stitch-interval").addEventListener("change", e => {
  const v = parseInt(e.target.value, 10);
  if (v >= 1) { stitchInterv = v; render(); }
});
document.getElementById("ridge-interval").addEventListener("change", e => {
  const v = parseInt(e.target.value, 10);
  if (v >= 1) { ridgeInterv = v; render(); }
});

gridCanvas.addEventListener("mousemove", e => {
  const rect = gridCanvas.getBoundingClientRect();
  gridCanvas.style.cursor =
    nearestGuide(e.clientX - rect.left) !== null ? "pointer" : "crosshair";
});

gridCanvas.addEventListener("click", e => {
  const rect    = gridCanvas.getBoundingClientRect();
  const canvasX = e.clientX - rect.left;
  const canvasY = e.clientY - rect.top;
  const sn = nearestGuide(canvasX);
  if (sn !== null) { showPopup(sn, e.clientX, e.clientY); return; }
  hidePopup();
  if (canvasX < ROW_LABEL_W) return;
  // Clicking a grid row always switches to WS mode (chart view)
  setRow(ridgeNum(Math.floor(canvasY / cellPx)), false);
});

document.addEventListener("click", e => {
  if (!guidePopup.contains(e.target) && e.target !== gridCanvas) hidePopup();
});

document.addEventListener("keydown", e => {
  if (document.activeElement.tagName === "INPUT") return;
  if (e.key === "Escape") { hidePopup(); return; }
  switch (e.key) {
    // ── Ridge navigation ─────────────────────────────────────────────────
    case "ArrowUp":   case "k":
      e.preventDefault();
      setRow(activeRidge + 1);
      break;
    case "ArrowDown": case "j":
      e.preventDefault();
      setRow(activeRidge - 1);
      break;
    case "Home":     e.preventDefault(); setRow(MIN_RIDGE); break;
    case "End":      e.preventDefault(); setRow(MAX_RIDGE); break;
    case "PageUp":   e.preventDefault(); setRow(activeRidge + ridgeInterv); break;
    case "PageDown": e.preventDefault(); setRow(activeRidge - ridgeInterv); break;

    // ── Stitch navigation (±10) ───────────────────────────────────────────
    case "ArrowRight": case " ":
      e.preventDefault();
      setStitch(activeStitch + 10);
      break;
    case "ArrowLeft":
      e.preventDefault();
      setStitch(activeStitch - 10);
      break;

    // ── Row toggle (WS ↔ RS) ─────────────────────────────────────────────
    case "Enter":
      e.preventDefault();
      if (isRightSideRow) {
        // Finished the RS row → show WS chart for this same ridge
        setRow(activeRidge, false);
      } else {
        // Finished the WS chart row → advance to next ridge's RS row
        setRow(activeRidge + 1, true);
      }
      break;

    // ── Zoom ─────────────────────────────────────────────────────────────
    case "+": case "=": setZoom(cellPx + 1); break;
    case "-": case "_": setZoom(cellPx - 1); break;
  }
});

document.getElementById("scroll-wrap").addEventListener("wheel", e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  setZoom(cellPx + (e.deltaY < 0 ? 1 : -1));
}, { passive: false });

// ─── init ──────────────────────────────────────────────────────────────────
document.getElementById("chart-title").textContent = PATTERN.title;
document.getElementById("goto-input").min = MIN_RIDGE;
document.getElementById("goto-input").max = MAX_RIDGE;

updateHistBadge();

// Load persisted stitch guide colors
loadStitchGuide();

const saved = loadState();
if (saved) {
  activeRidge    = Math.max(MIN_RIDGE, Math.min(MAX_RIDGE, saved.ridge  || 1));
  activeStitch   = Math.max(1,         Math.min(NCOLS,     saved.stitch || 1));
  isRightSideRow = !!saved.isRightSide;
}
// Full render + scroll to saved position
setRow(activeRidge, isRightSideRow);
scrollToActiveStitch();
</script>
</body>
</html>
